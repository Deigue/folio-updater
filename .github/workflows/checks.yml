name: Checks

# The same four commands as the pre-commit hooks and the Zed tasks.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint and test
    # Windows, like the release build and the machine the folio runs on.
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          # The release build's Python, so CI tests what ships.
          python-version: '3.13'
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-groups --locked

      - name: ruff check
        run: uv run ruff check

      - name: ruff format --check
        run: uv run ruff format --check

      # pyproject.toml also points ty at ../ws-api-python, a sibling checkout
      # that only exists locally, and ty refuses a missing path (a -c override
      # adds to extra-paths rather than replacing it). An empty stand-in lets
      # ws-api resolve from the installed package instead.
      - name: ty check
        run: |
          New-Item -ItemType Directory -Force ..\ws-api-python | Out-Null
          uv run ty check

      - name: pytest
        run: uv run pytest
